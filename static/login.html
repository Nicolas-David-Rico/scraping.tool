<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OfertaCO — Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
<script>
  (function () {
    var saved = localStorage.getItem("ofertaco-theme");
    var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (dark) document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --primary: #0066cc;
    --primary-focus: #0071e3;
    --ink: #1d1d1f;
    --ink-muted-80: #333333;
    --ink-muted-48: #7a7a7a;
    --hairline: #e0e0e0;
    --canvas: #ffffff;
    --canvas-parchment: #f5f5f7;
    --surface-black: #000000;
    --on-primary: #ffffff;
    --on-dark: #ffffff;
    --on-ink: #ffffff;
    --body-muted: #cccccc;
    --font-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    --font-text: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --ink: #ffffff;
    --ink-muted-80: #cccccc;
    --ink-muted-48: rgba(204, 204, 204, 0.72);
    --hairline: rgba(255, 255, 255, 0.14);
    --canvas: #272729;
    --canvas-parchment: #1d1d1f;
    --on-ink: #000000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--canvas-parchment);
    color: var(--ink);
    font-family: var(--font-text);
    font-size: 17px;
    font-weight: 400;
    line-height: 1.47;
    letter-spacing: -0.374px;
    font-feature-settings: "ss03";
    -webkit-font-smoothing: antialiased;
  }
  .global-nav {
    height: 44px;
    background: var(--surface-black);
    color: var(--on-dark);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
  }
  .global-nav-brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.224px;
    color: var(--on-dark);
  }
  .global-nav-mark {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    background: var(--on-dark);
    color: var(--surface-black);
    display: grid;
    place-items: center;
    font-size: 10px;
    font-weight: 700;
  }
  .nav-theme-btn {
    background: transparent;
    border: none;
    color: var(--body-muted);
    font-family: inherit;
    font-size: 12px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.12px;
    cursor: pointer;
    padding: 6px 4px;
    transition: transform 0.12s ease;
  }
  .nav-theme-btn:active { transform: scale(0.95); }
  .nav-theme-btn:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 2px; }
  main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 32px 17px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 32px;
  }
  .brand {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 24px;
  }
  .logo {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: var(--ink);
    color: var(--on-ink);
    display: grid;
    place-items: center;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.224px;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 34px;
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.374px;
    color: var(--ink);
  }
  p.sub {
    font-size: 14px;
    font-weight: 400;
    line-height: 1.43;
    letter-spacing: -0.224px;
    color: var(--ink-muted-48);
    margin-top: 4px;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.29;
    letter-spacing: -0.224px;
    color: var(--ink);
    margin: 16px 0 6px;
  }
  input {
    width: 100%;
    height: 44px;
    background: var(--canvas-parchment);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--ink);
    font-family: inherit;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: -0.374px;
    outline: none;
  }
  input:focus {
    border-color: var(--primary-focus);
    outline: 2px solid var(--primary-focus);
    outline-offset: 0;
  }
  button[type="submit"] {
    width: 100%;
    min-height: 44px;
    margin-top: 24px;
    padding: 11px 22px;
    border: none;
    border-radius: 9999px;
    background: var(--primary);
    color: var(--on-primary);
    font-family: inherit;
    font-size: 17px;
    font-weight: 400;
    line-height: 1.24;
    letter-spacing: -0.374px;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.15s ease;
  }
  button[type="submit"]:active:not(:disabled) { transform: scale(0.95); }
  button[type="submit"]:focus-visible { outline: 2px solid var(--primary-focus); outline-offset: 2px; }
  button[type="submit"]:disabled { opacity: 0.45; cursor: not-allowed; }
  .msg {
    margin-top: 16px;
    font-size: 14px;
    line-height: 1.43;
    letter-spacing: -0.224px;
    padding: 10px 14px;
    border-radius: 8px;
    display: none;
  }
  .msg.err {
    display: block;
    background: var(--canvas-parchment);
    border: 1px solid var(--ink);
    color: var(--ink);
  }
  .hint {
    font-size: 12px;
    line-height: 1.3;
    letter-spacing: -0.12px;
    color: var(--ink-muted-48);
    margin-top: 6px;
  }
  footer {
    text-align: center;
    padding: 24px 17px;
    font-size: 12px;
    line-height: 1.3;
    letter-spacing: -0.12px;
    color: var(--ink-muted-48);
  }
  @media (max-width: 480px) {
    .card { padding: 24px; }
    h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<nav class="global-nav" aria-label="OfertaCO">
  <div class="global-nav-brand">
    <span class="global-nav-mark">CO</span>
    <span>OfertaCO</span>
  </div>
  <button class="nav-theme-btn" id="themeToggleBtn" type="button" title="Cambiar entre modo claro y oscuro">Modo oscuro</button>
</nav>
<main>
  <div class="card">
    <div class="brand">
      <div class="logo">CO</div>
      <div>
        <h1 id="title">Iniciar sesión</h1>
        <p class="sub" id="sub">OfertaCO · acceso protegido</p>
      </div>
    </div>
    <form id="f">
      <label for="u">Usuario</label>
      <input id="u" autocomplete="username" required />
      <label for="p">Contraseña</label>
      <input id="p" type="password" autocomplete="current-password" required />
      <div id="confirmWrap" style="display:none">
        <label for="p2">Confirmar contraseña</label>
        <input id="p2" type="password" autocomplete="new-password" />
        <div class="hint">Mínimo 8 caracteres, con letras y números.</div>
      </div>
      <button id="btn" type="submit">Entrar</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</main>
<footer>OfertaCO · Comparador local de grandes superficies en Colombia</footer>
<script>
let setup = false;
const $ = (id) => document.getElementById(id);
function syncThemeLabel() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  $("themeToggleBtn").textContent = dark ? "Modo claro" : "Modo oscuro";
}
syncThemeLabel();
$("themeToggleBtn").addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  if (dark) {
    document.documentElement.removeAttribute("data-theme");
    localStorage.setItem("ofertaco-theme", "light");
  } else {
    document.documentElement.setAttribute("data-theme", "dark");
    localStorage.setItem("ofertaco-theme", "dark");
  }
  syncThemeLabel();
});
fetch("/api/auth/status").then(r => r.json()).then(s => {
  if (s.authenticated) return location.replace("/");
  setup = s.setup_required;
  if (setup) {
    $("title").textContent = "Crear cuenta de acceso";
    $("sub").textContent = "Primera vez: define tu usuario y contraseña";
    $("confirmWrap").style.display = "block";
    $("p").autocomplete = "new-password";
    $("btn").textContent = "Crear cuenta y entrar";
  }
});
$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("msg"); msg.className = "msg";
  if (setup && $("p").value !== $("p2").value) { msg.textContent = "Las contraseñas no coinciden."; msg.className = "msg err"; return; }
  $("btn").disabled = true;
  try {
    const res = await fetch(setup ? "/api/auth/setup" : "/api/auth/login", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username: $("u").value.trim(), password: $("p").value}),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) return location.replace("/");
    msg.textContent = data.detail || "No se pudo iniciar sesión."; msg.className = "msg err";
  } catch (err) { msg.textContent = "Error de conexión."; msg.className = "msg err"; }
  $("btn").disabled = false;
});
</script>
</body>
</html>
